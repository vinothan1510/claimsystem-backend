spring.application.name=claimsystem

# Database Configuration (Uses Railway variables online, defaults to your local DB if they aren't found)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:claimsystem}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD}


# Hibernate / JPA Settings
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.com.vinothan.claimsystem=DEBUG

# JWT Configurations
jwt.secret=${JWT_SECRET:vinothan-secret-key-1234567890-ThisIsForMyPrivateProject}
jwt.expiration=3600000

# Server Port (Railway injects the ${PORT} variable automatically. Defaults to 8080 locally)
server.port=${PORT:8080}