spring.application.name=claimsystem

# Use Railway's absolute unified variable instead of divided parts
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/claimsystem?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:pass%10}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Settings
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# Logging
logging.level.com.vinothan.claimsystem=DEBUG

# JWT Configurations
jwt.secret=${JWT_SECRET:vinothan-secret-key-1234567890-ThisIsForMyPrivateProject}
jwt.expiration=3600000

# Server Port
server.port=${PORT:8080}