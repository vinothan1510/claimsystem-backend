spring.application.name=claimsystem

# Production Database Configuration (Railway automatically reads these)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Settings
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# Logging
logging.level.com.vinothan.claimsystem=DEBUG

# JWT Configurations
jwt.secret=${JWT_SECRET:vinothan-secret-key-1234567890-ThisIsForMyPrivateProject}
jwt.expiration=3600000

# Server Port
server.port=${PORT:8080}