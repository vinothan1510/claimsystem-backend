spring.application.name=claimsystem

# 1. Main Production Database Configuration for Railway
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:claimsystem}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}

# 2. Safe Password Evaluation 
# If your password is "pass%10", put it exactly inside the quotes below:
spring.datasource.password=${MYSQL_PASSWORD:pass%10}

# 3. Explicit Driver declaration to ensure predictable parsing behavior
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Settings
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# Logging
logging.level.com.vinothan.claimsystem=DEBUG

# JWT Configurations
jwt.secret=${JWT_SECRET:vinothan-secret-key-1234567890-ThisIsForMyPrivateProject}
jwt.expiration=3600000

# Server Port
server.port=${PORT:8080}